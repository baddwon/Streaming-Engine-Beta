<!doctype html>
<html>
<head>
  <title>Public HLS Access</title>
  <style>
    body{font-family:Arial,sans-serif;background:#111;color:#eee;margin:24px}
    .card{background:#1b1b1b;border:1px solid #333;border-radius:10px;padding:16px;max-width:850px}
    input,textarea{width:100%;box-sizing:border-box;background:#080808;color:#eee;border:1px solid #444;border-radius:6px;padding:8px}
    textarea{height:160px;font-family:monospace}
    button{padding:10px 16px;margin-top:12px}
    .msg{color:#ffd166;white-space:pre-wrap}
    a{color:#9cf}
    code{background:#080808;padding:2px 5px;border-radius:4px}
  </style>
</head>
<body>
  <h1>Public HLS Access</h1>
  <p><a href="/engineer">Engineer</a> | <a href="/system">System</a> | <a href="/">Home</a></p>

  <div class="card">
    {% if message %}<p class="msg">{{ message }}</p>{% endif %}

    <form method="post">
      <p>
        <label>
          <input type="checkbox" name="public_hls_enabled" style="width:auto"
            {% if settings.get("public_hls_enabled") %}checked{% endif %}>
          Restrict Public HLS Pulls by CIDR
        </label>
      </p>

      <p>
        <label>Public Base URL</label><br>
        <input name="public_hls_base_url"
               value="{{ settings.get('public_hls_base_url','') }}"
               placeholder="http://public-ip-or-dns:8088">
      </p>

      <p>
        <label>Allowed CIDRs, one per line</label><br>
        <textarea name="public_hls_allowed_cidrs" placeholder="173.225.32.125/32&#10;173.225.32.124/32">{{ cidrs }}</textarea>
      </p>

      <p>
        <label>
          <input type="checkbox" name="apply_nginx" style="width:auto" checked>
          Apply nginx ACL now
        </label>
      </p>

      <button type="submit">Save Public HLS Access</button>
    </form>

    <h3>Example Pull URL</h3>
    <p><code>{{ settings.get('public_hls_base_url','http://PUBLIC-IP:8088') }}/hls/Ch_75/stream.m3u8</code></p>
  </div>
</body>
</html>
